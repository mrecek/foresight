name: Scheduled Security Audit

on:
  workflow_dispatch:
  schedule:
    - cron: "15 13 * * *"

permissions:
  contents: read

jobs:
  dependencies:
    name: Security/dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          bundler-cache: true

      - name: Audit Ruby, JavaScript, and application security
        run: bin/security-audit

      - name: Report dependency audit scope
        if: always()
        run: |
          {
            echo "## Dependency security audit"
            echo
            echo "- Ruby lockfile: refreshed ruby-advisory-db via Bundler Audit"
            echo "- Pinned default gems: resolved versions in Gemfile.lock, including JSON and resolv"
            echo "- Browser imports: Importmap audit"
            echo "- Rails application: Brakeman static analysis"
            echo
            echo "Remediation: update the affected lockfile dependency or pinned Ruby default gem, then rerun this workflow."
          } >> "$GITHUB_STEP_SUMMARY"

  image:
    name: Security/image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build production image
        run: docker build --tag foresight-security-audit:${{ github.sha }} .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: foresight-security-audit:${{ github.sha }}
          version: v0.74.0
          format: json
          output: trivy-report.json
          exit-code: "0"
          ignore-unfixed: false
          vuln-type: os,library
          severity: HIGH,CRITICAL
          scanners: vuln

      - name: Report scanner and database versions
        run: trivy --version | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Enforce actionable image vulnerability policy
        run: bin/check-trivy-report trivy-report.json

      - name: Upload complete Trivy report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-image-report-${{ github.run_id }}
          path: trivy-report.json
          if-no-files-found: error
          retention-days: 30
