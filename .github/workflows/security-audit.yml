name: Scheduled Security Audit

on:
  workflow_dispatch:
  schedule:
    - cron: "15 13 * * *"

permissions:
  contents: read
  packages: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  BUILDX_VERSION: v0.37.1
  BUILDKIT_IMAGE: moby/buildkit:v0.33.0@sha256:6c2fa84a6b61ccd72899dde4239f8d5717f05f9a8ca6f3cad185fb1a95a94de3

jobs:
  dependencies:
    name: Security/dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          bundler-cache: true

      - name: Audit Ruby, JavaScript, and application security
        run: bin/security-audit

  resolve:
    name: Resolve released image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      digest: ${{ steps.release.outputs.digest }}
    steps:
      - name: Checkout default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          version: ${{ env.BUILDX_VERSION }}
          driver-opts: |
            image=${{ env.BUILDKIT_IMAGE }}

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve released digest once for both platforms
        id: release
        run: |
          set -euo pipefail
          digest="$(bin/resolve-image-digest "${REGISTRY}/${IMAGE_NAME}:latest")"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  image:
    name: Security/image (${{ matrix.platform }})
    env:
      DIGEST: ${{ needs.resolve.outputs.digest }}
    needs: resolve
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    steps:
      - name: Checkout default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Ruby for image evidence checks
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Trivy and scan the released platform
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_IMAGE_SRC: remote
          TRIVY_PLATFORM: ${{ matrix.platform }}
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ env.DIGEST }}
          version: v0.74.0
          format: json
          output: trivy-${{ matrix.arch }}.json
          exit-code: "0"
          ignore-unfixed: false
          vuln-type: os,library
          severity: HIGH,CRITICAL
          scanners: vuln

      - name: Verify released runtime and vulnerability policy
        id: policy
        env:
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          reference="${REGISTRY}/${IMAGE_NAME}@${DIGEST}"
          bin/container-gem-versions "$reference" "$PLATFORM" "gems-$ARCH.json"
          bin/check-trivy-report "trivy-$ARCH.json" "gems-$ARCH.json"

      - name: Check released platform image age
        if: always() && needs.resolve.outputs.digest != ''
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          reference="${REGISTRY}/${IMAGE_NAME}@${DIGEST}"
          docker pull --platform "$PLATFORM" "$reference" >/dev/null
          built_at="$(docker image inspect "$reference" --format '{{.Created}}')"
          built_epoch="$(date -u -d "$built_at" +%s)"
          now="$(date -u +%s)"
          {
            echo "## Released container: ${PLATFORM}"
            echo
            echo "- Digest: \`${reference}\`"
            echo "- Built: \`${built_at}\`"
            echo "- Daily release and audit schedules are best effort; a build older than seven days fails this fallback check."
            echo "- Vulnerability policy result: \`${{ steps.policy.outcome }}\`"
            echo "- Remediation: update affected source dependencies or inspect the daily release workflow. This audit does not dispatch rebuilds."
          } >> "$GITHUB_STEP_SUMMARY"
          if (( now - built_epoch > 7 * 24 * 60 * 60 )); then
            echo "::error::Released image for ${PLATFORM} is older than seven days; inspect the release workflow."
            exit 1
          fi

      - name: Upload released platform evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-image-report-${{ matrix.arch }}-${{ github.run_id }}
          path: |
            trivy-${{ matrix.arch }}.json
            gems-${{ matrix.arch }}.json
          if-no-files-found: error
          retention-days: 30
