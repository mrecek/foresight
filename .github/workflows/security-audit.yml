name: Scheduled Security Audit

on:
  workflow_dispatch:
  schedule:
    - cron: "15 13 * * *"

permissions:
  contents: read
  packages: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  BUILDX_VERSION: v0.37.1
  BUILDKIT_IMAGE: moby/buildkit:v0.33.0@sha256:6c2fa84a6b61ccd72899dde4239f8d5717f05f9a8ca6f3cad185fb1a95a94de3

jobs:
  dependencies:
    name: Security/dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          bundler-cache: true

      - name: Audit Ruby, JavaScript, and application security
        run: bin/security-audit

  image:
    name: Security/image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
        with:
          version: ${{ env.BUILDX_VERSION }}
          driver-opts: |
            image=${{ env.BUILDKIT_IMAGE }}

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve released digest
        id: release
        run: |
          set -euo pipefail
          digest="$(bin/resolve-image-digest "${REGISTRY}/${IMAGE_NAME}:latest")"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Install Trivy and scan released amd64 digest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.release.outputs.digest }}
          version: v0.74.0
          format: json
          output: trivy-amd64.json
          exit-code: "0"
          ignore-unfixed: false
          vuln-type: os,library
          severity: HIGH,CRITICAL
          scanners: vuln

      - name: Scan released arm64 digest
        run: |
          trivy image --platform linux/arm64 --format json --output trivy-arm64.json \
            --scanners vuln --vuln-type os,library --severity HIGH,CRITICAL --ignore-unfixed=false \
            "${REGISTRY}/${IMAGE_NAME}@${{ steps.release.outputs.digest }}"

      - name: Verify released runtime and vulnerability policy on both platforms
        id: policy
        env:
          DIGEST: ${{ steps.release.outputs.digest }}
        run: |
          set -euo pipefail
          failed=0
          reference="${REGISTRY}/${IMAGE_NAME}@${DIGEST}"
          for arch in amd64 arm64; do
            bin/container-gem-versions "$reference" "linux/$arch" "gems-$arch.json"
            bin/check-trivy-report "trivy-$arch.json" "gems-$arch.json" || failed=1
          done
          exit "$failed"

      - name: Check released image age
        if: always() && steps.release.outputs.digest != ''
        env:
          DIGEST: ${{ steps.release.outputs.digest }}
        run: |
          set -euo pipefail
          reference="${REGISTRY}/${IMAGE_NAME}@${DIGEST}"
          docker image rm --force "$reference" >/dev/null 2>&1 || true
          docker pull --platform linux/amd64 "$reference" >/dev/null
          built_at="$(docker image inspect "$reference" --format '{{.Created}}')"
          built_epoch="$(date -u -d "$built_at" +%s)"
          now="$(date -u +%s)"
          {
            echo "## Released container"
            echo
            echo "- Digest: \`${reference}\`"
            echo "- Built: \`${built_at}\`"
            echo "- Daily release and audit schedules are best effort; a build older than seven days fails this fallback check."
            echo "- Vulnerability policy result: \`${{ steps.policy.outcome }}\`"
            echo "- Remediation: update affected source dependencies or inspect the daily release workflow. This audit does not dispatch rebuilds."
          } >> "$GITHUB_STEP_SUMMARY"
          if (( now - built_epoch > 7 * 24 * 60 * 60 )); then
            echo "::error::Released image is older than seven days; inspect the release workflow."
            exit 1
          fi

      - name: Upload released image evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-image-report-${{ github.run_id }}
          path: |
            trivy-*.json
            gems-*.json
          if-no-files-found: error
          retention-days: 30
