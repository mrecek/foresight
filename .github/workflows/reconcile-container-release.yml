name: Reconcile Container Release

on:
  workflow_dispatch:
  schedule:
    - cron: "30 14 * * *"

concurrency:
  group: container-release-reconciliation
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

permissions:
  actions: write
  contents: read
  packages: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current default branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve expected release identity
        id: release
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          image="${REGISTRY}/${IMAGE_NAME}"
          date="$(git show -s --format=%cs "$COMMIT_SHA" | tr - .)"
          immutable="${date}-${COMMIT_SHA:0:7}"
          marker="sha-${COMMIT_SHA}"

          inspect() {
            docker buildx imagetools inspect "${image}:$1" --format '{{json .Manifest.Digest}}' 2>/dev/null | tr -d '"'
          }

          marker_digest="$(inspect "$marker" || true)"
          immutable_digest="$(inspect "$immutable" || true)"
          if [[ -n "$marker_digest" && -n "$immutable_digest" && "$marker_digest" != "$immutable_digest" ]]; then
            echo "::error::Release marker and immutable tag disagree"
            exit 1
          fi

          digest="${marker_digest:-$immutable_digest}"
          echo "date=$date" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "complete=$([[ -n "$marker_digest" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Verify and converge a known release
        if: steps.release.outputs.digest != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bin/promote-container-release "${REGISTRY}/${IMAGE_NAME}" "${{ steps.release.outputs.digest }}" "${{ github.sha }}" "${{ steps.release.outputs.date }}"

      - name: Check for release already in flight
        if: steps.release.outputs.digest == ''
        id: active
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          active="$(gh run list --workflow docker.yml --branch "${GITHUB_DEFAULT_BRANCH}" --json status --jq '[.[] | select(.status == "queued" or .status == "in_progress")] | length')"
          echo "found=$([[ "$active" -gt 0 ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Safely redispatch a missing release
        if: steps.release.outputs.digest == '' && steps.active.outputs.found == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run docker.yml --ref "${GITHUB_DEFAULT_BRANCH}"

      - name: Publish reconciliation summary
        if: always()
        run: |
          {
            echo "## Container release reconciliation"
            echo
            echo "- Default-branch commit: \`${{ github.sha }}\`"
            echo "- Expected digest: \`${{ steps.release.outputs.digest || 'not yet promoted' }}\`"
            echo "- Completion marker existed: \`${{ steps.release.outputs.complete || 'false' }}\`"
            echo "- A known digest is fully verified before missing mutable tags or the final completion marker are repaired."
          } >> "$GITHUB_STEP_SUMMARY"
