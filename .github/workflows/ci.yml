name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shutdown:
    name: Diagnose arm64 shutdown (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4
        if: matrix.runner == 'ubuntu-24.04'
        with:
          platforms: arm64
      - name: Exercise exact candidate and capture shutdown backtrace
        env:
          CONTAINER_SMOKE_HEALTH_ATTEMPTS: 120
          DOCKER_DEFAULT_PLATFORM: linux/arm64
          IMAGE: ghcr.io/mrecek/foresight@sha256:88087798e93665436a16341abefcd55d8c64c774210784a8f4a1eb68caade951
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('bin/container-smoke')
          s = p.read_text().replace('docker stop --time 30 "$container_name" >/dev/null', '''docker stop --time 30 "$container_name" >/dev/null &
          stop_pid=$!
          sleep 10
          if [[ "$(docker inspect --format '{{.State.Running}}' "$container_name")" == "true" ]]; then
            docker kill --signal=PWR "$container_name" >/dev/null
          fi
          wait "$stop_pid"''')
          p.write_text(s)
          PY
          docker pull --platform linux/arm64 "$IMAGE"
          bin/container-smoke "$IMAGE"
