name: Build and Promote Docker Image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "docs/**"
      - ".agents/**"
      - ".claude/**"

concurrency:
  group: container-release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

permissions:
  contents: read
  packages: write
  attestations: write
  artifact-metadata: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute candidate identity
        id: release
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          release_date="$(git show -s --format=%cs "$COMMIT_SHA" | tr - .)"
          candidate="candidate-${COMMIT_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "date=$release_date" >> "$GITHUB_OUTPUT"
          echo "candidate=$candidate" >> "$GITHUB_OUTPUT"

      - name: Ensure run-specific candidate tag is unused
        env:
          CANDIDATE: ${{ steps.release.outputs.candidate }}
        run: |
          if docker buildx imagetools inspect "${REGISTRY}/${IMAGE_NAME}:${CANDIDATE}" >/dev/null 2>&1; then
            echo "::error::Run-specific candidate tag already exists"
            exit 1
          fi

      - name: Build and push unpromoted candidate
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.release.outputs.candidate }}
          cache-from: type=gha,scope=foresight
          cache-to: type=gha,mode=max,scope=foresight
          provenance: mode=max
          sbom: true

      - name: Verify candidate platforms
        run: bin/check-container-manifest "${REGISTRY}/${IMAGE_NAME}@${{ steps.push.outputs.digest }}"

      - name: Smoke test candidate on amd64 and arm64
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          CONTAINER_SMOKE_HEALTH_ATTEMPTS: 120
        run: |
          set -euo pipefail
          reference="${REGISTRY}/${IMAGE_NAME}@${DIGEST}"
          for platform in linux/amd64 linux/arm64; do
            docker pull --platform "$platform" "$reference"
            DOCKER_DEFAULT_PLATFORM="$platform" bin/container-smoke "$reference"
            # A digest reference can point at only one platform in the local
            # image store. Remove it before resolving the next platform.
            docker image rm "$reference"
          done

      - name: Generate provenance attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Promote verified candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bin/promote-container-release "${REGISTRY}/${IMAGE_NAME}" "${{ steps.push.outputs.digest }}" "${{ github.sha }}" "${{ steps.release.outputs.date }}"

      - name: Publish release summary
        if: always()
        run: |
          {
            echo "## Container release"
            echo
            echo "- Candidate: \`${REGISTRY}/${IMAGE_NAME}:${{ steps.release.outputs.candidate }}@${{ steps.push.outputs.digest }}\`"
            echo "- Completion marker: \`${REGISTRY}/${IMAGE_NAME}:sha-${{ github.sha }}\`"
            echo "- Candidate tags are retained as immutable audit references."
            echo "- Release tags change only after both architecture smoke tests and attestation verification pass."
          } >> "$GITHUB_STEP_SUMMARY"
