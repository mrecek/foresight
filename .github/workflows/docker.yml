name: Build, Verify, and Promote Container

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Why this release is being built
        required: true
        default: manual
        type: choice
        options: [manual, security, validation]
  schedule:
    - cron: "37 7 * * *"
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "docs/**"
      - ".agents/**"
      - ".claude/**"
      - ".github/**"
      - "test/**"

concurrency:
  group: foresight-container-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
  BUILDX_VERSION: v0.37.1
  BUILDKIT_IMAGE: moby/buildkit:v0.33.0@sha256:6c2fa84a6b61ccd72899dde4239f8d5717f05f9a8ca6f3cad185fb1a95a94de3

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      candidate: ${{ steps.release.outputs.candidate }}
      release_id: ${{ steps.release.outputs.release_id }}
      reason: ${{ steps.release.outputs.reason }}
      promoted_digest: ${{ steps.promoted.outputs.digest }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
        with:
          version: ${{ env.BUILDX_VERSION }}
          driver-opts: |
            image=${{ env.BUILDKIT_IMAGE }}

      - name: Set up Ruby
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          bundler-cache: true

      - name: Validate application at candidate source
        run: bin/validate --ci

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute candidate identity
        id: release
        env:
          REQUESTED_REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          case "${GITHUB_EVENT_NAME}" in
            push) reason=source ;;
            schedule) reason=scheduled-refresh ;;
            workflow_dispatch) reason="${REQUESTED_REASON}" ;;
            *) echo "::error::Unsupported trigger ${GITHUB_EVENT_NAME}"; exit 1 ;;
          esac
          built_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          identity="$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_SHA:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          {
            echo "reason=$reason"
            echo "built_at=$built_at"
            echo "candidate=candidate-$identity"
            echo "release_id=$identity"
          } >> "$GITHUB_OUTPUT"

      - name: Ensure run-specific candidate tag is unused
        env:
          CANDIDATE: ${{ steps.release.outputs.candidate }}
        run: |
          existing="$(bin/resolve-image-digest "${REGISTRY}/${IMAGE_NAME}:${CANDIDATE}" --allow-missing)"
          if [[ -n "$existing" ]]; then
            echo "::error::Run-specific candidate tag already exists"
            exit 1
          fi

      - name: Build and push unpromoted candidate
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.release.outputs.candidate }}
          cache-from: type=gha,scope=foresight
          cache-to: type=gha,mode=max,scope=foresight
          no-cache-filters: os-packages
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.release.outputs.built_at }}

      - name: Resolve promoted digest
        id: promoted
        run: |
          digest="$(bin/resolve-image-digest "${REGISTRY}/${IMAGE_NAME}:latest" --allow-missing)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Record candidate metadata
        env:
          CANDIDATE: ${{ steps.release.outputs.candidate }}
          CANDIDATE_DIGEST: ${{ steps.push.outputs.digest }}
          PROMOTED_DIGEST: ${{ steps.promoted.outputs.digest }}
          RELEASE_REASON: ${{ steps.release.outputs.reason }}
          BUILT_AT: ${{ steps.release.outputs.built_at }}
        run: |
          mkdir -p refresh-evidence
          jq -n \
            --arg source_commit "$GITHUB_SHA" \
            --arg built_at "$BUILT_AT" \
            --arg trigger_reason "$RELEASE_REASON" \
            --arg candidate_tag "$CANDIDATE" \
            --arg candidate_digest "$CANDIDATE_DIGEST" \
            --arg promoted_digest "$PROMOTED_DIGEST" \
            '{source_commit: $source_commit, built_at: $built_at, trigger_reason: $trigger_reason,
              candidate_tag: $candidate_tag, candidate_digest: $candidate_digest,
              promoted_digest: (if $promoted_digest == "" then null else $promoted_digest end)}' > refresh-evidence/candidate.json

      - name: Verify candidate platforms
        run: bin/check-container-manifest "${REGISTRY}/${IMAGE_NAME}@${{ steps.push.outputs.digest }}"

      - name: Verify candidate provenance and SBOM
        run: bin/check-container-metadata "${REGISTRY}/${IMAGE_NAME}@${{ steps.push.outputs.digest }}"

      - name: Upload candidate evidence
        if: always() && steps.push.outputs.digest != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: refresh-evidence
          if-no-files-found: error
          retention-days: 30

  verify:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      DIGEST: ${{ needs.build.outputs.digest }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Ruby for image policy tools
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke test exact candidate on its native architecture
        shell: bash
        env:
          DOCKER_DEFAULT_PLATFORM: ${{ matrix.platform }}
          CONTAINER_SMOKE_HEALTH_ATTEMPTS: 120
        run: |
          {
            docker pull --platform "${DOCKER_DEFAULT_PLATFORM}" "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"
            bin/container-smoke "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"
          } 2>&1 | tee smoke-${{ matrix.arch }}.log

      - name: Scan native candidate with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_IMAGE_SRC: remote
          TRIVY_PLATFORM: ${{ matrix.platform }}
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ env.DIGEST }}
          version: v0.74.0
          format: json
          output: trivy-${{ matrix.arch }}.json
          exit-code: "0"
          ignore-unfixed: false
          vuln-type: os,library
          severity: HIGH,CRITICAL
          scanners: vuln

      - name: Verify candidate runtime and vulnerability policy
        env:
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
        run: |
          bin/container-gem-versions "${REGISTRY}/${IMAGE_NAME}@${DIGEST}" "$PLATFORM" "gems-$ARCH.json"
          bin/check-trivy-report "trivy-$ARCH.json" "gems-$ARCH.json"

      - name: Upload architecture verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-verification-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            smoke-*.log
            trivy-*.json
            gems-*.json
          if-no-files-found: error
          retention-days: 30

  promote:
    needs: [build, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      attestations: write
      artifact-metadata: write
      id-token: write
    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Ruby for image metadata tools
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
        with:
          version: ${{ env.BUILDX_VERSION }}
          driver-opts: |
            image=${{ env.BUILDKIT_IMAGE }}

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate provenance attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ needs.build.outputs.digest }}
          push-to-registry: true

      - name: Promote verified candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_PROMOTED_DIGEST: ${{ needs.build.outputs.promoted_digest }}
        run: bin/promote-container-release "${REGISTRY}/${IMAGE_NAME}" "${{ needs.build.outputs.digest }}" "${{ github.sha }}" "${{ needs.build.outputs.release_id }}" "${{ needs.build.outputs.reason }}"

      - name: Publish release summary
        if: always()
        run: |
          {
            echo "## Container candidate"
            echo
            echo "- Trigger: \`${{ needs.build.outputs.reason }}\`"
            echo "- Candidate: \`${REGISTRY}/${IMAGE_NAME}:${{ needs.build.outputs.candidate }}@${{ needs.build.outputs.digest }}\`"
            echo "- Previous production digest: \`${{ needs.build.outputs.promoted_digest || 'none' }}\`"
            echo "- Every candidate requires the complete verification contract, including scheduled refreshes."
            echo "- Release tags move only after manifest, smoke, vulnerability, and attestation gates pass."
          } >> "$GITHUB_STEP_SUMMARY"
