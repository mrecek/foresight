name: Build and Push Docker Image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'docs/**'
      - '.agents/**'
      - '.claude/**'
      - '.github/dependabot.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute release version
        id: release
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          date="$(date -u +'%Y.%m.%d')"
          short_sha="${COMMIT_SHA:0:7}"

          echo "date=${date}" >> "$GITHUB_OUTPUT"
          echo "immutable=${date}-${short_sha}" >> "$GITHUB_OUTPUT"

      - name: Ensure immutable release tag is unused
        env:
          VERSION: ${{ steps.release.outputs.immutable }}
        run: |
          set -euo pipefail

          image="${REGISTRY}/${IMAGE_NAME}:${VERSION}"
          if docker buildx imagetools inspect "${image}" >/dev/null 2>&1; then
            echo "::error::Immutable release tag already exists: ${image}"
            exit 1
          fi

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.release.outputs.immutable }},priority=900
            type=raw,value=${{ steps.release.outputs.date }},priority=800
            type=raw,value=latest,priority=700
            type=sha,format=long,prefix=sha-,priority=600

      - name: Build and push multi-architecture image
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=foresight
          cache-to: type=gha,mode=max,scope=foresight
          provenance: mode=max
          sbom: true

      - name: Smoke test immutable amd64 image
        env:
          VERSION: ${{ steps.release.outputs.immutable }}
        run: |
          set -euo pipefail

          image="${REGISTRY}/${IMAGE_NAME}:${VERSION}"
          docker pull --platform linux/amd64 "${image}"
          docker run -d --name smoke-test -p 3000:8080 --platform linux/amd64 "${image}"
          trap 'docker logs smoke-test; docker rm -f smoke-test' EXIT

          echo "Waiting for container to start..."
          sleep 10
          curl --fail --retry 5 --retry-delay 2 http://localhost:3000/up

      - name: Generate build provenance attestation
        uses: actions/attest@f6bf1532d7d6793fce74eac584813a8eee607999 # v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Publish release summary
        env:
          VERSION: ${{ steps.release.outputs.immutable }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "## Published container image"
            echo
            echo "- Immutable release: \`${REGISTRY}/${IMAGE_NAME}:${VERSION}@${DIGEST}\`"
            echo "- Daily channel: \`${REGISTRY}/${IMAGE_NAME}:${{ steps.release.outputs.date }}\`"
            echo "- Rolling channel: \`${REGISTRY}/${IMAGE_NAME}:latest\`"
          } >> "$GITHUB_STEP_SUMMARY"
