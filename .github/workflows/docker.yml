name: Build and Promote Docker Image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "docs/**"
      - ".agents/**"
      - ".claude/**"

concurrency:
  group: container-release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

permissions:
  contents: read
  packages: write
  attestations: write
  artifact-metadata: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute candidate identity
        id: release
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          release_date="$(git show -s --format=%cs "$COMMIT_SHA" | tr - .)"
          candidate="candidate-${COMMIT_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "date=$release_date" >> "$GITHUB_OUTPUT"
          echo "candidate=$candidate" >> "$GITHUB_OUTPUT"

      - name: Ensure run-specific candidate tag is unused
        env:
          CANDIDATE: ${{ steps.release.outputs.candidate }}
        run: |
          if docker buildx imagetools inspect "${REGISTRY}/${IMAGE_NAME}:${CANDIDATE}" >/dev/null 2>&1; then
            echo "::error::Run-specific candidate tag already exists"
            exit 1
          fi

      - name: Build and push unpromoted candidate
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.release.outputs.candidate }}
          cache-from: type=gha,scope=foresight
          cache-to: type=gha,mode=max,scope=foresight
          provenance: mode=max
          sbom: true

      - name: Verify candidate platforms
        run: bin/check-container-manifest "${REGISTRY}/${IMAGE_NAME}@${{ steps.push.outputs.digest }}"

      - name: Smoke test candidate on amd64 and arm64
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          reference="${REGISTRY}/${IMAGE_NAME}@${DIGEST}"
          for platform in linux/amd64 linux/arm64; do
            docker pull --platform "$platform" "$reference"
            DOCKER_DEFAULT_PLATFORM="$platform" bin/container-smoke "$reference"
          done

      - name: Generate provenance attestation
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Promote verified candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bin/promote-container-release "${REGISTRY}/${IMAGE_NAME}" "${{ steps.push.outputs.digest }}" "${{ github.sha }}" "${{ steps.release.outputs.date }}"

      - name: Publish release summary
        if: always()
        run: |
          {
            echo "## Container release"
            echo
            echo "- Candidate: \`${REGISTRY}/${IMAGE_NAME}:${{ steps.release.outputs.candidate }}@${{ steps.push.outputs.digest }}\`"
            echo "- Completion marker: \`${REGISTRY}/${IMAGE_NAME}:sha-${{ github.sha }}\`"
            echo "- Candidate tags are retained as immutable audit references."
            echo "- Release tags change only after both architecture smoke tests and attestation verification pass."
          } >> "$GITHUB_STEP_SUMMARY"
