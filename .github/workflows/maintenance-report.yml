name: Report maintenance failures

on:
  workflow_run:
    workflows: ["Build, Verify, and Promote Container", "Scheduled Security Audit"]
    types: [completed]

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: foresight-maintenance-report
  cancel-in-progress: false

jobs:
  report:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_branch == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout trusted default branch reporter
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Update active maintenance issue
        run: ruby .github/scripts/report-maintenance-failure
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAINTENANCE_RUN_ID: ${{ github.event.workflow_run.id }}
