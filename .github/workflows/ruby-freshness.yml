name: Ruby Patch Freshness

env:
  BUILDX_VERSION: v0.37.1
  BUILDKIT_IMAGE: moby/buildkit:v0.33.0@sha256:6c2fa84a6b61ccd72899dde4239f8d5717f05f9a8ca6f3cad185fb1a95a94de3

on:
  workflow_dispatch:
  schedule:
    - cron: "15 15 * * 1"

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: ruby-patch-freshness
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          version: ${{ env.BUILDX_VERSION }}
          driver-opts: |
            image=${{ env.BUILDKIT_IMAGE }}

      - name: Set up mise for lockfile maintenance
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          install: false
          cache: false
          minimum_release_age: 7d

      - name: Check the official Ruby release tags
        id: ruby
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bin/check-ruby-freshness --github-output "$GITHUB_OUTPUT"

      - name: Check for an existing update
        if: steps.ruby.outputs.status == 'stale'
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: automation/ruby-patch-${{ steps.ruby.outputs.latest }}
        run: |
          count="$(gh pr list --state all --head "$BRANCH" --json number --jq length)"
          echo "found=$([[ "$count" -gt 0 ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Resolve and apply the updated image identity
        if: steps.ruby.outputs.status == 'stale' && steps.existing.outputs.found == 'false'
        env:
          VERSION: ${{ steps.ruby.outputs.latest }}
        run: |
          set -euo pipefail
          image="docker.io/library/ruby:${VERSION}-slim-trixie"
          digest="$(docker buildx imagetools inspect "$image" --format '{{json .Manifest.Digest}}' | jq -r .)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          bin/update-ruby-patch --version "$VERSION" --digest "$digest"
          mise lock ruby

      - name: Set up updated Ruby
        if: steps.ruby.outputs.status == 'stale' && steps.existing.outputs.found == 'false'
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          bundler-cache: true

      - name: Validate the update candidate
        if: steps.ruby.outputs.status == 'stale' && steps.existing.outputs.found == 'false'
        run: bin/validate --ci

      - name: Open the patch update pull request
        if: steps.ruby.outputs.status == 'stale' && steps.existing.outputs.found == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ruby.outputs.latest }}
          BRANCH: automation/ruby-patch-${{ steps.ruby.outputs.latest }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --create "$BRANCH"
          git add .ruby-version .mise.toml mise.lock Dockerfile
          git commit -m "Update Ruby to ${VERSION}"
          git push origin "$BRANCH"
          pr_url="$(gh pr create \
            --base "${{ github.event.repository.default_branch }}" \
            --head "$BRANCH" \
            --label dependencies \
            --title "Update Ruby to ${VERSION}" \
            --body "Updates the supported Ruby patch and pins the matching multi-architecture base-image digest. The full non-container validation contract passed in [the freshness run](${RUN_URL}). Major and minor Ruby upgrades remain manual.")"
          gh workflow run ci.yml --ref "$BRANCH"
          gh pr merge --auto --squash "$pr_url"

      - name: Publish freshness summary
        if: always()
        env:
          STATUS: ${{ steps.ruby.outputs.status }}
          CURRENT: ${{ steps.ruby.outputs.current }}
          LATEST: ${{ steps.ruby.outputs.latest }}
          EXISTING: ${{ steps.existing.outputs.found }}
        run: |
          {
            echo "## Ruby patch freshness"
            echo
            echo "- Configured: \`${CURRENT:-unknown}\`"
            echo "- Latest patch in the configured series: \`${LATEST:-unknown}\`"
            echo "- Status: \`${STATUS:-upstream-check-failed}\`"
            if [[ "${EXISTING}" == "true" ]]; then
              echo "- An update pull request for this patch already exists or was previously considered."
            fi
            echo
            echo "Patch releases are automated. Ruby major and minor upgrades require an explicit architecture review."
          } >> "$GITHUB_STEP_SUMMARY"
