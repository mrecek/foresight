name: Ruby Patch Freshness

env:
  BUILDX_VERSION: v0.37.1
  BUILDKIT_IMAGE: moby/buildkit:v0.33.0@sha256:6c2fa84a6b61ccd72899dde4239f8d5717f05f9a8ca6f3cad185fb1a95a94de3

on:
  workflow_dispatch:
  schedule:
    - cron: "15 15 * * 1"

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: ruby-patch-freshness
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
        with:
          version: ${{ env.BUILDX_VERSION }}
          driver-opts: |
            image=${{ env.BUILDKIT_IMAGE }}

      - name: Set up mise for lockfile maintenance
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          install: false
          cache: false
          minimum_release_age: 7d

      - name: Check the official Ruby release tags
        id: ruby
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bin/check-ruby-freshness --github-output "$GITHUB_OUTPUT"

      - name: Resolve and apply the updated image identity
        if: steps.ruby.outputs.status == 'stale'
        env:
          VERSION: ${{ steps.ruby.outputs.latest }}
        run: |
          set -euo pipefail
          image="docker.io/library/ruby:${VERSION}-slim-trixie"
          digest="$(docker buildx imagetools inspect "$image" --format '{{json .Manifest.Digest}}' | jq -r .)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          bin/update-ruby-patch --version "$VERSION" --digest "$digest"
          mise lock ruby

      - name: Set up updated Ruby
        if: steps.ruby.outputs.status == 'stale'
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          bundler-cache: true

      - name: Validate the update candidate
        if: steps.ruby.outputs.status == 'stale'
        run: bin/validate --ci

      - name: Create or update the patch pull request
        if: steps.ruby.outputs.status == 'stale'
        id: pull-request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: automation/ruby-patch
          base: ${{ github.event.repository.default_branch }}
          add-paths: |
            .ruby-version
            .mise.toml
            mise.lock
            Dockerfile
          commit-message: Update Ruby to ${{ steps.ruby.outputs.latest }}
          title: Update Ruby to ${{ steps.ruby.outputs.latest }}
          labels: dependencies
          body: |
            Updates the supported Ruby patch, all runtime declarations, and the multi-architecture base-image digest together.

            Full non-container validation passed in [the freshness run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).
            Major and minor Ruby upgrades remain manual.

      - name: Validate the pull request head and enable patch auto-merge
        if: steps.pull-request.outputs.pull-request-number && steps.pull-request.outputs.pull-request-operation != 'closed'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.pull-request.outputs.pull-request-branch }}
          PR_URL: ${{ steps.pull-request.outputs.pull-request-url }}
        run: |
          set -euo pipefail
          # GITHUB_TOKEN pushes do not trigger CI. Dispatch on every open head,
          # including retries of an existing unchanged pull request.
          gh workflow run ci.yml --ref "$BRANCH"
          gh pr merge --auto --squash "$PR_URL"

      - name: Publish freshness summary
        if: always()
        env:
          STATUS: ${{ steps.ruby.outputs.status }}
          CURRENT: ${{ steps.ruby.outputs.current }}
          LATEST: ${{ steps.ruby.outputs.latest }}
          PR_URL: ${{ steps.pull-request.outputs.pull-request-url }}
        run: |
          {
            echo "## Ruby patch freshness"
            echo
            echo "- Configured: \`${CURRENT:-unknown}\`"
            echo "- Latest patch in the configured series: \`${LATEST:-unknown}\`"
            echo "- Status: \`${STATUS:-upstream-check-failed}\`"
            if [[ -n "${PR_URL}" ]]; then
              echo "- Update pull request: ${PR_URL}"
            fi
            echo
            echo "Patch releases are automated. Ruby major and minor upgrades require an explicit architecture review."
          } >> "$GITHUB_STEP_SUMMARY"
