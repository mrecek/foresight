version: 2
updates:
  - package-ecosystem: bundler
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Denver
    # Include indirect gems even when the advisory is absent from GitHub alerts.
    allow:
      - dependency-type: all
    open-pull-requests-limit: 5
    groups:
      minor-and-patch-gems:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      security-gems:
        applies-to: security-updates
        patterns:
          - "*"
    labels:
      - "dependencies"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - "*"
    labels:
      - "dependencies"

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: America/Denver
    labels:
      - "dependencies"
    # Dockerfile is the runtime declaration for containers, local mise and CI.
    # Patch updates are tested and eligible for auto-merge; series changes are reviewed.
    ignore:
      - dependency-name: "library/ruby"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
