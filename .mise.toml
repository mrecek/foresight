min_version = "2025.1.0"

[settings]
ruby.compile = false

[tools]
ruby = "{{ exec(command='bin/ruby-version') }}"

[tasks.setup]
description = "Install dependencies, hooks, and prepare the development database."
run = "bin/setup --skip-server"

[tasks.dev]
description = "Run the Rails and Tailwind development processes."
run = "bin/dev"

[tasks.test]
description = "Run the complete application test suite."
run = "bin/test"

[tasks.check]
description = "Run the complete local validation contract."
run = "bin/validate"
